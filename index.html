<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beer Counter 🍺</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; padding: 20px;
    }
    .container { text-align: center; max-width: 400px; width: 100%; }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; text-shadow: 0 4px 20px rgba(255,165,0,0.5); }
    .counter {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,165,0,0.3);
      border-radius: 24px;
      padding: 3rem 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .count { font-size: 7rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: #ffa500; text-shadow: 0 0 30px rgba(255,165,0,0.6), 0 4px 20px rgba(0,0,0,0.5); transition: transform 0.1s ease; }
    .count.bump { transform: scale(1.1); }
    .label { font-size: 1.2rem; color: #aaa; margin-top: 0.5rem; text-transform: uppercase; letter-spacing: 2px; }
    .btn-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    button {
      border: none; border-radius: 16px; padding: 1rem 2rem; font-size: 1.1rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease; min-width: 140px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    button:active { transform: scale(0.95); }
    .btn-add { background: linear-gradient(135deg, #ff8c00, #ff6b00); color: #1a1a2e; }
    .btn-add:hover { box-shadow: 0 6px 24px rgba(255,140,0,0.5); }
    .btn-sub { background: linear-gradient(135deg, #4a4a6a, #3a3a5a); color: #fff; }
    .btn-sub:hover { box-shadow: 0 6px 24px rgba(74,74,106,0.5); }
    .btn-reset { background: linear-gradient(135deg, #6a3a3a, #5a2a2a); color: #ffaaaa; }
    .btn-reset:hover { box-shadow: 0 6px 24px rgba(106,58,58,0.5); }
    .stats { display: flex; justify-content: space-around; margin-top: 2rem; gap: 1rem; flex-wrap: wrap; }
    .stat { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,165,0,0.2); border-radius: 16px; padding: 1rem 1.5rem; min-width: 100px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #ffa500; }
    .stat-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    @media (max-width: 480px) {
      .count { font-size: 5rem; }
      h1 { font-size: 2rem; }
      button { min-width: 110px; padding: 0.8rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍺 Beer Counter</h1>
    <div class="counter">
      <div class="count" id="count">0</div>
      <div class="label">piviek</div>
    </div>
    <div class="btn-group">
      <button class="btn-add" id="btnAdd">+ Pridať</button>
      <button class="btn-sub" id="btnSub">− Odoberať</button>
      <button class="btn-reset" id="btnReset">Reset</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-value" id="statToday">0</div><div class="stat-label">Dnes</div></div>
      <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Celkom</div></div>
      <div class="stat"><div class="stat-value" id="statSession">0</div><div class="stat-label">Táto relácia</div></div>
    </div>
  </div>

  <script>
    const countEl = document.getElementById('count');
    const btnAdd = document.getElementById('btnAdd');
    const btnSub = document.getElementById('btnSub');
    const btnReset = document.getElementById('btnReset');
    const statToday = document.getElementById('statToday');
    const statTotal = document.getElementById('statTotal');
    const statSession = document.getElementById('statSession');

    let count = parseInt(localStorage.getItem('beerCount') || '0', 10);
    let todayKey = new Date().toISOString().split('T')[0];
    let todayCount = parseInt(localStorage.getItem('beerToday_' + todayKey) || '0', 10);
    let sessionCount = 0;

    function render() {
      countEl.textContent = count;
      statToday.textContent = todayCount;
      statTotal.textContent = count;
      statSession.textContent = sessionCount;
      countEl.classList.remove('bump');
      void countEl.offsetWidth;
      countEl.classList.add('bump');
    }

    function save() {
      localStorage.setItem('beerCount', count.toString());
      localStorage.setItem('beerToday_' + todayKey, todayCount.toString());
    }

    btnAdd.addEventListener('click', () => { count++; todayCount++; sessionCount++; save(); render(); });
    btnSub.addEventListener('click', () => { if (count > 0) { count--; if (todayCount > 0) todayCount--; if (sessionCount > 0) sessionCount--; save(); render(); } });
    btnReset.addEventListener('click', () => { if (confirm('Naozaj chceš resetovať všetky počítadlá?')) { count = 0; todayCount = 0; sessionCount = 0; save(); render(); } });

    // Check if day changed
    const savedDay = localStorage.getItem('beerDay');
    if (savedDay !== todayKey) {
      localStorage.setItem('beerDay', todayKey);
      todayCount = 0;
      localStorage.setItem('beerToday_' + todayKey, '0');
    }

    render();
  </script>
</body>
</html>
